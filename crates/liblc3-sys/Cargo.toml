[package]
name = "liblc3-sys"
version = "0.0.0"
description = "Test/bench oracle only: liblc3 1.1.3 (Google, Apache-2.0) compiled from the pinned tarball in .cache/liblc3, strict IEEE float (no -ffast-math, no FMA contraction)"
publish = false
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[build-dependencies]
cc = "1"

# FFI to C: deliberately without the workspace lints (unsafe_code = "deny"); the empty table
# says so and silences cargo's missing-lints-inheritance warning.
[lints]
